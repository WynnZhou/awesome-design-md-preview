<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0b0b0c; --panel: #121214; --line: rgba(255,255,255,.10);
  --fg: #f5f5f7; --dim: rgba(255,255,255,.5); --accent: #6ea8fe;
  --hover: rgba(255,255,255,.06); --active: rgba(110,168,254,.16);
  --active-line: rgba(110,168,254,.35); --field: rgba(255,255,255,.05);
  --new: #ffb020; --new-line: rgba(255,176,32,.45); --track: rgba(255,255,255,.08);
  --warn: #ff6b6b;
}
html[data-theme="light"] {
  --bg: #ffffff; --panel: #f6f6f8; --line: rgba(0,0,0,.11);
  --fg: #17171a; --dim: rgba(0,0,0,.52); --accent: #0a5fd6;
  --hover: rgba(0,0,0,.05); --active: rgba(10,95,214,.12);
  --active-line: rgba(10,95,214,.35); --field: rgba(0,0,0,.035);
  --new: #9a6300; --new-line: rgba(154,99,0,.4); --track: rgba(0,0,0,.07);
  --warn: #c62828;
}
html, body { height: 100%; }
body {
  display: grid; grid-template-columns: 288px 1fr; height: 100vh; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
}
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.head { padding: 16px 16px 12px; height: 72px; border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 10px; }
.head h1 { flex: 1; font-size: 15px; letter-spacing: -.2px; min-width: 0; }
.head p { font-size: 11px; color: var(--dim); margin-top: 3px; line-height: 16px; }
.tgl {
  flex: none; width: 28px; height: 24px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  font: inherit; font-size: 12px; line-height: 1; color: var(--dim);
  background: var(--track); border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
}
.tgl:hover { color: var(--fg); background: var(--hover); }
.tgl:active { transform: scale(.94); }
.tgl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the language and version chips carry a word, not a glyph. Both widths are pinned to the widest
   label they can ever show — "EN" for #lang, "Merged" for #ver — so the row never reflows when the
   language or the mode changes; the text centres inside. */
.tgl-txt { width: 32px; padding: 0; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
#ver { width: 58px; }
.search { padding: 12px 16px; height: 59px; border-bottom: 1px solid var(--line); }
.search input {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--fg);
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; outline: none;
}
.search input:focus { border-color: var(--accent); }
.list { flex: 1; overflow-y: auto; padding: 8px; }
/* the same ten groups the README lists; a heading hides with its rows */
.group-head { padding: 11px 10px 4px; font-size: 10px; font-weight: 700;
              letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.group:first-child .group-head { padding-top: 2px; }
.item {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; padding: 9px 10px;
  font: inherit; text-align: left; color: var(--fg); background: none; border: 0;
  border-radius: 8px; cursor: pointer;
}
.item:hover { background: var(--hover); }
.item.active { background: var(--active); box-shadow: inset 0 0 0 1px var(--active-line); }
.ico { flex: none; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
.av { width: 18px; height: 18px; border-radius: 5px; object-fit: contain; display: block; }
.av ~ .sw { display: none; }          /* icon present → colour chip steps aside */
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.tx { flex: 1; min-width: 0; }
.r1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.n { font-size: 13px; font-weight: 600; letter-spacing: -.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m { display: block; font-size: 11px; color: var(--dim); margin-top: 3px; line-height: 1.35;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.new { flex: none; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
        color: var(--new); border: 1px solid var(--new-line); border-radius: 4px; padding: 0 4px; line-height: 14px; }
.item.off { cursor: default; opacity: .42; }
.item.off:hover { background: none; }
.sw.off { background: var(--track); }

main { display: flex; flex-direction: column; min-width: 0; }

iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
@media (max-width: 760px) {

  <div class="bar">

<script>
const root = document.documentElement;
const frame = document.getElementById('frame');
const tglTheme = document.getElementById('theme');
const tglVer = document.getElementById('ver');
const tglLang = document.getElementById('lang');
const items = [...document.querySelectorAll('button.item')];
const allItems = [...document.querySelectorAll('.item')];
const sub = document.getElementById('sub');
const none = document.getElementById('none');
const cur = document.getElementById('cur');
const curpath = document.getElementById('curpath');
const curnote = document.getElementById('curnote');
const curmeta = document.getElementById('curmeta');
const openLink = document.getElementById('open');
const q = document.getElementById('q');

// The list rows carry their English text and a data-zh translation. Freeze the English here, before
// the first paint can swap it out, or switching back would have nothing to restore.
allItems.forEach(b => {
  const m = b.querySelector('.m');
  b.dataset.en = m ? m.textContent : '';
  b.dataset.enTitle = b.getAttribute('title') || '';
});
document.querySelectorAll('.group-head').forEach(h => { h.dataset.en = h.textContent; });

// index.html's own chrome and its style list — the previews themselves are never touched.
// Chinese is the default.
const I18N = {
  zh: {
    doc: 'zh-CN',
    sub: '76 个风格 · 全部可本地预览',
    filter: '筛选风格…  ( / )',
    none: '没有匹配项',
    open: '新标签页打开 ↗',
    themeAria: '切换浅色 / 深色',
    themeTitle: '切换浅色 / 深色 (t)',
    langTitle: 'Switch language / 切换中英文',
    verTitle: '合并版 preview.html / 分离版 preview_light.html + preview_dark.html',
    merged: '合并版',
    split: '分离版',
    auto: '自动版',
    noAuto: '没有 auto 页',
    noDark: '没有深色页',
    docTitle: n => n + ' — DESIGN 预览'
  },
  en: {
    doc: 'en',
    sub: '76 styles · all previewable locally',
    filter: 'Filter styles…  ( / )',
    none: 'No match.',
    open: 'Open in new tab ↗',
    themeAria: 'Switch light or dark',
    themeTitle: 'Switch light / dark (t)',
    langTitle: 'Switch language / 切换中英文',
    verTitle: 'Merged preview.html / split preview_light.html + preview_dark.html',
    merged: 'Merged',
    split: 'Split',
    auto: 'Auto',
    noAuto: 'no auto page',
    noDark: 'no dark page',
    docTitle: n => n + ' — DESIGN previews'
  }
};

let theme = 'dark';
let ver = 'merged';   // merged = preview.html · split = preview_light/dark.html · auto = preview_auto.html
const VER_ORDER = ['merged', 'split', 'auto'];
let lang = 'zh';
let slug = '', itemName = '';

function paint() {
  const tr = I18N[lang];
  cur.textContent = itemName || '—';
  curpath.textContent = !slug ? '' : 'design-md/' + slug + '/' + paneFile();
  curnote.textContent = slug ? fallbackNote(tr) : '';
  document.title = itemName ? tr.docTitle(itemName) : 'DESIGN';
  root.lang = tr.doc;
  sub.textContent = tr.sub;
  q.placeholder = tr.filter;
  none.textContent = tr.none;
  openLink.textContent = tr.open;
  // the theme and language chips show what a click will get you; the version chip names the mode
  // it is already in, because "the other one" says nothing about which previews you are looking at
  tglTheme.textContent = theme === 'dark' ? '☀' : '☾';
  tglTheme.setAttribute('aria-label', tr.themeAria);
  tglTheme.title = tr.themeTitle;
  tglLang.textContent = lang === 'zh' ? 'EN' : '中';
  tglLang.title = tr.langTitle;
  tglVer.textContent = tr[ver];
  tglVer.title = tr.verTitle;
  // the list rows translate with everything else. The brand name stays put — it is a proper noun —
  // but the description line and its tooltip follow the language chip.
  allItems.forEach(b => {
    const zh = b.dataset.zh, m = b.querySelector('.m');
    if (!zh || !m) return;
    if (lang === 'zh') {
      m.textContent = zh;
      b.title = zh;
    } else {
      m.textContent = b.dataset.en;
      b.title = b.dataset.enTitle;
    }
  });
  // the category headings translate with the rows they head
  document.querySelectorAll('.group-head').forEach(h => {
    h.textContent = lang === 'zh' && h.dataset.zh ? h.dataset.zh : h.dataset.en;
  });
}

// Which styles are missing one of the three pages. Both lists are filled in by build_previews.py
// from what is actually on disk, so they cannot go stale: no dark page upstream, or no DESIGN.md
// to generate an auto page from.
const NO_DARK = ['bmw-m', 'lamborghini'];
const NO_AUTO = ['mobbin', 'discord'];

// Which file the single pane loads. Both modes show one page — they differ only in the source:
// merged serves preview.html and lets the page swap its own theme; split serves the theme-specific
// document getdesign.md authored, which is the only way to see the two originals apart.
// The viewer falls back rather than loading a 404 — BMW M and Lamborghini have no dark page,
// Discord and Mobbin no auto page. Say so, or the pane quietly showing another file reads as a bug.
function fallbackNote(tr) {
  if (ver === 'auto' && NO_AUTO.includes(slug)) return tr.noAuto;
  if (ver === 'split' && theme === 'dark' && NO_DARK.includes(slug)) return tr.noDark;
  return '';
}

function paneFile() {
  if (ver === 'merged') return 'preview.html';
  if (ver === 'auto') return NO_AUTO.includes(slug) ? 'preview.html' : 'preview_auto.html';
  return (theme === 'dark' && !NO_DARK.includes(slug)) ? 'preview_dark.html' : 'preview_light.html';
}

function loadPanes() {
  if (!slug) return;
  const file = paneFile();
  frame.src = './design-md/' + slug + '/' + file + (ver === 'split' ? '' : '?theme=' + theme);
  openLink.href = './design-md/' + slug + '/' + file;
  frame.dataset.loaded = ver + ':' + slug;
}

function setTheme(name, save) {
  theme = name === 'light' ? 'light' : 'dark';
  root.dataset.theme = theme;
  if (save) try { localStorage.setItem('design-md:theme', theme); } catch (e) {}
  // merged and auto both carry the theme script and swap in place over postMessage — a reload
  // would flash the old theme first. The split pair has no theme plumbing at all: they *are* the
  // two themes, so switching the chip has to load the other file.
  if (ver !== 'split' && frame.dataset.loaded === ver + ':' + slug) {
    try { frame.contentWindow.postMessage({ type: 'design-md:theme', theme }, '*'); } catch (e) {}
  } else {
    loadPanes();
  }
  paint();
}

function setVer(name, save) {
  ver = VER_ORDER.indexOf(name) >= 0 ? name : 'merged';
  if (save) try { localStorage.setItem('design-md:version', ver); } catch (e) {}
  loadPanes();
  paint();
}

function setLang(name, save) {
  lang = name === 'en' ? 'en' : 'zh';
  if (save) try { localStorage.setItem('design-md:lang', lang); } catch (e) {}
  paint();
}

tglTheme.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark', true));
tglVer.addEventListener('click',
  () => setVer(VER_ORDER[(VER_ORDER.indexOf(ver) + 1) % VER_ORDER.length], true));
tglLang.addEventListener('click', () => setLang(lang === 'zh' ? 'en' : 'zh', true));
addEventListener('message', e => {
  const d = e.data;
  if (d && d.type === 'design-md:theme' && d.from === 'preview' && d.theme !== theme) {
    setTheme(d.theme, true);
  }
});

function show(s, n, push) {
  slug = s;
  itemName = n;
  items.forEach(b => b.classList.toggle('active', b.dataset.slug === s));
  const hit = items.find(b => b.dataset.slug === s);
  curmeta.textContent = hit ? (hit.dataset.meta || '') : '';
  loadPanes();
  paint();
  try { localStorage.setItem('design-md:last', s); } catch (e) {}
  if (push) history.replaceState(null, '', '#' + s);
}

items.forEach(b => b.addEventListener('click', () => show(b.dataset.slug, b.dataset.name, true)));

// Pasting a #slug link into an already-open tab only moves the hash — no reload, so without
// this the preview pane keeps showing the previous style and the link looks broken.
addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1));
  const hit = items.find(b => b.dataset.slug === h);
  if (hit && !hit.classList.contains('active')) show(hit.dataset.slug, hit.dataset.name, false);
});

q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  let shown = 0;
  allItems.forEach(b => {
    // both languages, so a row is findable whichever one is on screen. The name is a proper noun
    // and is not translated, so it only has to be matched once.
    const hay = [b.querySelector('.n') ? b.querySelector('.n').textContent : '',
                 b.dataset.en || '', b.dataset.zh || ''].join(' ').toLowerCase();
    const hit = !v || hay.includes(v);
    b.hidden = !hit;
    if (hit) shown++;
  });
  document.getElementById('none').hidden = shown > 0;
  // a group whose rows all filtered out goes too, heading and all
  document.querySelectorAll('.group').forEach(g => {
    g.hidden = ![...g.querySelectorAll('button.item')].some(b => !b.hidden);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 't' && document.activeElement !== q) {
    setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', true); return;
  }
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const vis = items.filter(b => !b.hidden);
  if (!vis.length) return;
  e.preventDefault();
  const at = vis.findIndex(b => b.classList.contains('active'));
  const next = vis[Math.min(vis.length - 1, Math.max(0, at + (e.key === 'ArrowDown' ? 1 : -1)))];
  next.click();
  next.scrollIntoView({ block: 'nearest' });
});

let saved = null, savedVer = null, savedLang = null;
try {
  saved = localStorage.getItem('design-md:theme');
  savedVer = localStorage.getItem('design-md:version');
  savedLang = localStorage.getItem('design-md:lang');
} catch (e) {}
setVer(savedVer, false);     // null -> merged, i.e. preview.html
setLang(savedLang, false);   // null -> Chinese
setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), false);

const hash = decodeURIComponent(location.hash.slice(1));
let last = null;
try { last = localStorage.getItem('design-md:last'); } catch (e) {}
const start = items.find(b => b.dataset.slug === hash) || items.find(b => b.dataset.slug === last) || items[0];
if (start) show(start.dataset.slug, start.dataset.name, false);
</script>
</body></html>
